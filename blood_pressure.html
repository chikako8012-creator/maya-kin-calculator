<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>血圧メモ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #f2ede8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #5a3d2b;
}
.header {
  width: 100%; max-width: 480px;
  background: linear-gradient(135deg, #fff8f0, #fdf0e0);
  padding: 22px 20px 16px;
  text-align: center;
  border-bottom: 3px solid #e0c090;
}
.header h1 { font-size: 1.25rem; letter-spacing: 0.08em; }
.header p  { font-size: 0.78rem; color: #8a6a50; margin-top: 5px; }

.container { width: 100%; max-width: 480px; padding: 18px 14px 60px; }

.card {
  background: #fff;
  border-radius: 18px;
  padding: 18px 16px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.09);
  margin-bottom: 16px;
}
.card h2 {
  font-size: 0.85rem; color: #7a5a40;
  margin-bottom: 14px; text-align: center; letter-spacing: 0.1em;
}

/* 朝夜トグル */
.timing-row { display: flex; gap: 10px; margin-bottom: 16px; }
.timing-btn {
  flex: 1; padding: 11px 0;
  border: 2px solid #ddd0c0; border-radius: 12px;
  background: #fffcf8; color: #a08060;
  font-size: 1rem; font-weight: bold; font-family: inherit;
  cursor: pointer; transition: all 0.15s;
}
.timing-btn.active { background: #b07848; color: #fff; border-color: #b07848; }

/* 数値入力 */
.input-grid { display: flex; gap: 8px; justify-content: center; align-items: flex-end; margin-bottom: 8px; }
.input-group { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
.input-group label { font-size: 0.72rem; color: #a08060; font-weight: bold; }
.input-group input {
  width: 100%; padding: 12px 4px;
  border: 2px solid #ddd0c0; border-radius: 12px;
  font-size: 1.5rem; font-family: inherit; font-weight: bold;
  color: #5a3d2b; background: #fffcf8;
  text-align: center; outline: none;
}
.input-group input:focus { border-color: #b07848; }
.unit { font-size: 0.68rem; color: #b09070; margin-top: 2px; }

.save-btn {
  width: 100%; margin-top: 14px; padding: 14px 0;
  border: none; border-radius: 14px;
  background: #c0392b; color: #fff;
  font-size: 1.05rem; font-weight: bold; font-family: inherit;
  cursor: pointer; transition: opacity 0.15s;
}
.save-btn:active { opacity: 0.8; }
.save-msg { text-align: center; font-size: 0.82rem; color: #4e7a42; margin-top: 10px; height: 18px; }

/* 平均 */
.avg-row { display: flex; gap: 8px; text-align: center; }
.avg-box { flex: 1; background: #faf5ef; border-radius: 12px; padding: 12px 4px; }
.avg-box .lbl { font-size: 0.68rem; color: #a08060; }
.avg-box .val { font-size: 1.4rem; font-weight: bold; color: #5a3d2b; margin-top: 2px; }
.avg-note { font-size: 0.72rem; color: #b09070; text-align: center; margin-top: 10px; }

/* グラフ */
#chart { width: 100%; height: 180px; display: block; }
.legend { display: flex; gap: 16px; justify-content: center; margin-top: 8px; font-size: 0.74rem; }
.legend span { display: flex; align-items: center; gap: 5px; color: #7a5a40; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* 一覧 */
.record-list { list-style: none; }
.record-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 4px; border-bottom: 1px solid #f0e8de;
  font-size: 0.86rem;
}
.record-item:last-child { border-bottom: none; }
.rec-date { color: #8a6a50; font-size: 0.78rem; width: 96px; flex-shrink: 0; }
.rec-timing { font-size: 0.7rem; padding: 2px 7px; border-radius: 8px; margin-right: 6px; }
.rec-timing.morning { background: #fff3e0; color: #e08a28; }
.rec-timing.night  { background: #e8eaf6; color: #5a6abf; }
.rec-vals { flex: 1; font-weight: bold; color: #5a3d2b; }
.rec-vals small { font-weight: normal; color: #a08060; font-size: 0.72rem; }
.rec-del { color: #ccc; font-size: 1.1rem; cursor: pointer; padding: 0 6px; }
.empty { text-align: center; color: #b09070; font-size: 0.84rem; padding: 20px 0; }

.high { color: #c0392b !important; }
</style>
</head>
<body>

<div class="header">
  <h1>🩺 血圧メモ</h1>
  <p>毎日の血圧をサッと記録</p>
</div>

<div class="container">

  <!-- 入力カード -->
  <div class="card">
    <h2>― 今日の血圧を記録 ―</h2>

    <div class="timing-row">
      <button class="timing-btn active" data-timing="morning" id="btnMorning">🌅 朝</button>
      <button class="timing-btn" data-timing="night" id="btnNight">🌙 夜</button>
    </div>

    <div class="input-grid">
      <div class="input-group">
        <label>上（最高）</label>
        <input type="number" id="sys" inputmode="numeric" placeholder="120">
        <span class="unit">mmHg</span>
      </div>
      <div class="input-group">
        <label>下（最低）</label>
        <input type="number" id="dia" inputmode="numeric" placeholder="80">
        <span class="unit">mmHg</span>
      </div>
      <div class="input-group">
        <label>脈拍</label>
        <input type="number" id="pulse" inputmode="numeric" placeholder="任意">
        <span class="unit">回/分</span>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">記録する</button>
    <p class="save-msg" id="saveMsg"></p>
  </div>

  <!-- 平均カード -->
  <div class="card" id="avgCard" style="display:none;">
    <h2>― 直近7回の平均 ―</h2>
    <div class="avg-row">
      <div class="avg-box"><div class="lbl">上（最高）</div><div class="val" id="avgSys">-</div></div>
      <div class="avg-box"><div class="lbl">下（最低）</div><div class="val" id="avgDia">-</div></div>
      <div class="avg-box"><div class="lbl">脈拍</div><div class="val" id="avgPulse">-</div></div>
    </div>
    <p class="avg-note">※ 家庭血圧の目安：上 135 / 下 85 未満<br>（赤字は目安を超えた値）</p>
  </div>

  <!-- グラフカード -->
  <div class="card" id="chartCard" style="display:none;">
    <h2>― 血圧の推移（最新15回）―</h2>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:#c0392b;"></i>上</span>
      <span><i class="dot" style="background:#2980b9;"></i>下</span>
    </div>
  </div>

  <!-- 一覧カード -->
  <div class="card">
    <h2>― 記録一覧 ―</h2>
    <ul class="record-list" id="recordList"></ul>
  </div>

</div>

<script>
const KEY = 'bp_records_v1';
let timing = 'morning';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch { return []; }
}
function save(records) {
  localStorage.setItem(KEY, JSON.stringify(records));
}

// 朝夜トグル
document.getElementById('btnMorning').onclick = () => setTiming('morning');
document.getElementById('btnNight').onclick = () => setTiming('night');
function setTiming(t) {
  timing = t;
  document.getElementById('btnMorning').classList.toggle('active', t === 'morning');
  document.getElementById('btnNight').classList.toggle('active', t === 'night');
}

// 記録
document.getElementById('saveBtn').onclick = () => {
  const sys = parseInt(document.getElementById('sys').value, 10);
  const dia = parseInt(document.getElementById('dia').value, 10);
  const pulseRaw = document.getElementById('pulse').value;
  const pulse = pulseRaw === '' ? null : parseInt(pulseRaw, 10);
  const msg = document.getElementById('saveMsg');

  if (isNaN(sys) || isNaN(dia)) {
    msg.style.color = '#c0392b';
    msg.textContent = '上と下の血圧を入力してね';
    return;
  }

  const records = load();
  records.push({
    ts: Date.now(),
    timing,
    sys, dia,
    pulse: (pulse !== null && !isNaN(pulse)) ? pulse : null,
  });
  save(records);

  document.getElementById('sys').value = '';
  document.getElementById('dia').value = '';
  document.getElementById('pulse').value = '';
  msg.style.color = '#4e7a42';
  msg.textContent = '✅ 記録しました！';
  setTimeout(() => { msg.textContent = ''; }, 2500);
  render();
};

function fmtDate(ts) {
  const d = new Date(ts);
  const dows = '日月火水木金土';
  return `${d.getMonth() + 1}/${d.getDate()}（${dows[d.getDay()]}）`;
}

function render() {
  const records = load().sort((a, b) => a.ts - b.ts);
  renderList(records);
  renderAvg(records);
  renderChart(records);
}

function renderList(records) {
  const ul = document.getElementById('recordList');
  if (records.length === 0) {
    ul.innerHTML = '<li class="empty">まだ記録がありません</li>';
    return;
  }
  ul.innerHTML = records.slice().reverse().map(r => {
    const sysHigh = r.sys >= 135 ? 'high' : '';
    const diaHigh = r.dia >= 85 ? 'high' : '';
    const tcls = r.timing === 'morning' ? 'morning' : 'night';
    const tlabel = r.timing === 'morning' ? '朝' : '夜';
    const pulse = r.pulse != null ? ` <small>脈${r.pulse}</small>` : '';
    return `<li class="record-item">
      <span class="rec-date">${fmtDate(r.ts)}</span>
      <span class="rec-timing ${tcls}">${tlabel}</span>
      <span class="rec-vals"><span class="${sysHigh}">${r.sys}</span> / <span class="${diaHigh}">${r.dia}</span>${pulse}</span>
      <span class="rec-del" data-ts="${r.ts}">×</span>
    </li>`;
  }).join('');

  ul.querySelectorAll('.rec-del').forEach(el => {
    el.onclick = () => {
      if (!confirm('この記録を削除しますか？')) return;
      const ts = Number(el.dataset.ts);
      save(load().filter(r => r.ts !== ts));
      render();
    };
  });
}

function renderAvg(records) {
  const card = document.getElementById('avgCard');
  if (records.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const last = records.slice(-7);
  const avg = (arr) => Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
  const aSys = avg(last.map(r => r.sys));
  const aDia = avg(last.map(r => r.dia));
  const pulses = last.map(r => r.pulse).filter(p => p != null);
  document.getElementById('avgSys').innerHTML = `<span class="${aSys >= 135 ? 'high' : ''}">${aSys}</span>`;
  document.getElementById('avgDia').innerHTML = `<span class="${aDia >= 85 ? 'high' : ''}">${aDia}</span>`;
  document.getElementById('avgPulse').textContent = pulses.length ? avg(pulses) : '-';
}

function renderChart(records) {
  const card = document.getElementById('chartCard');
  if (records.length < 2) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const data = records.slice(-15);
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = 180;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const padL = 34, padR = 10, padT = 14, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const allVals = data.flatMap(r => [r.sys, r.dia]);
  let min = Math.min(...allVals, 60);
  let max = Math.max(...allVals, 140);
  min = Math.floor((min - 5) / 10) * 10;
  max = Math.ceil((max + 5) / 10) * 10;

  const x = i => padL + (data.length === 1 ? plotW / 2 : (plotW * i) / (data.length - 1));
  const y = v => padT + plotH - ((v - min) / (max - min)) * plotH;

  // 横グリッド＆目盛り
  ctx.strokeStyle = '#f0e8de'; ctx.fillStyle = '#b09070';
  ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  for (let v = min; v <= max; v += 20) {
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(W - padR, y(v)); ctx.stroke();
    ctx.fillText(v, padL - 4, y(v) + 3);
  }

  // 目安ライン（上135/下85）
  ctx.setLineDash([4, 3]); ctx.strokeStyle = '#e8b0a0';
  ctx.beginPath(); ctx.moveTo(padL, y(135)); ctx.lineTo(W - padR, y(135)); ctx.stroke();
  ctx.strokeStyle = '#a0c0e0';
  ctx.beginPath(); ctx.moveTo(padL, y(85)); ctx.lineTo(W - padR, y(85)); ctx.stroke();
  ctx.setLineDash([]);

  // 折れ線
  function drawLine(key, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    data.forEach((r, i) => { i === 0 ? ctx.moveTo(x(i), y(r[key])) : ctx.lineTo(x(i), y(r[key])); });
    ctx.stroke();
    ctx.fillStyle = color;
    data.forEach((r, i) => { ctx.beginPath(); ctx.arc(x(i), y(r[key]), 3, 0, Math.PI * 2); ctx.fill(); });
  }
  drawLine('sys', '#c0392b');
  drawLine('dia', '#2980b9');

  // 下の日付（最初・中央・最後）
  ctx.fillStyle = '#b09070'; ctx.textAlign = 'center'; ctx.font = '9px sans-serif';
  const marks = [0, Math.floor((data.length - 1) / 2), data.length - 1];
  [...new Set(marks)].forEach(i => {
    const d = new Date(data[i].ts);
    ctx.fillText(`${d.getMonth() + 1}/${d.getDate()}`, x(i), H - 6);
  });
}

render();
window.addEventListener('resize', () => renderChart(load().sort((a, b) => a.ts - b.ts)));
</script>

</body>
</html>
